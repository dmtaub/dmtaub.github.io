<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather — Daniel M. Taub</title>
    <link type="text/css" rel="stylesheet" href="../style.css">
    <link type="text/css" rel="stylesheet" href="./util.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root { --page-max-width: 900px; }

        /* ── Location tabs ── */
        .loc-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:0.85rem; }
        .loc-tab-btn { background:none; border:none; border-bottom:2px solid transparent; padding:0.4rem 1rem; cursor:pointer; font-size:0.88rem; font-weight:600; color:var(--text-muted); margin-bottom:-1px; transition:color .15s, border-color .15s; }
        .loc-tab-btn:hover { color:var(--text); }
        .loc-tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

        /* ── Preset location links ── */
        .loc-bar { display:flex; gap:0; flex-wrap:wrap; align-items:baseline; margin-bottom:1.25rem; line-height:2; }
        .loc-link { background:none; border:none; padding:0 0.6rem; cursor:pointer; font-size:0.88rem; color:var(--text-muted); white-space:nowrap; transition:color .15s; position:relative; }
        .loc-link + .loc-link::before { content:'·'; position:absolute; left:0; color:var(--border); pointer-events:none; }
        .loc-link:hover { color:var(--accent); }
        .loc-link.active { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
        .loc-link.bold-loc { font-weight:700; color:var(--text); }
        .loc-link.bold-loc.active { color:var(--accent); }
        .loc-link.loc-expand { color:var(--text-muted); letter-spacing:0.05em; font-size:0.8rem; }
        .loc-link.loc-expand:hover { color:var(--accent); }
        .loc-bar-empty { font-size:0.88rem; color:var(--text-muted); font-style:italic; }

        /* ── Custom tab chips + form ── */
        .zip-bar { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1.25rem; }
        .zip-chip { display:inline-flex; align-items:center; gap:0.25rem; padding:0.3rem 0.65rem; border-radius:var(--pill-radius); border:1px solid var(--border); background:var(--surface); font-size:0.85rem; cursor:pointer; color:var(--text-muted); transition:all .15s; white-space:nowrap; }
        .zip-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        .zip-chip:hover:not(.active) { border-color:var(--accent-soft); color:var(--text); }
        .chip-label { pointer-events:none; }
        .chip-remove { background:none; border:none; cursor:pointer; color:inherit; opacity:.55; font-size:1rem; line-height:1; padding:0 0 0 0.15rem; }
        .chip-remove:hover { opacity:1; }
        .zip-add-form { display:flex; gap:0.4rem; }
        .zip-input { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:0.3rem 0.65rem; font-size:0.85rem; color:var(--text); width:165px; }
        .zip-input:focus { outline:none; border-color:var(--accent-soft); }
        .zip-input::placeholder { color:var(--text-muted); }
        .btn-add-zip { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0.3rem 0.8rem; cursor:pointer; font-size:0.85rem; white-space:nowrap; transition:opacity .15s; }
        .btn-add-zip:hover { opacity:.85; }

        /* ── Forecast header ── */
        .forecast-header { margin-bottom:1rem; }
        .forecast-location { font-size:1.25rem; font-weight:700; color:var(--text); margin-bottom:0.2rem; }
        .forecast-current { font-size:0.9rem; color:var(--text-muted); }

        /* ── Chart controls ── */
        .chart-controls { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-bottom:0.75rem; }
        .toggle-group { display:flex; gap:0.25rem; }
        .toggle-btn { background:none; border:1px solid var(--border); border-radius:5px; padding:0.25rem 0.65rem; cursor:pointer; font-size:0.8rem; color:var(--text-muted); transition:all .15s; }
        .toggle-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .toggle-btn:hover:not(.active) { border-color:var(--accent-soft); color:var(--text); }
        .controls-spacer { flex:1; }

        /* ── Chart ── */
        .chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem 0.75rem; margin-bottom:1rem; }

        /* ── Hourly table ── */
        .hourly-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
        .hourly-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        .hourly-table th { background:var(--bg); color:var(--text-muted); font-weight:600; text-align:left; padding:0.35rem 0.75rem; border-bottom:1px solid var(--border); white-space:nowrap; }
        .hourly-table td { padding:0.3rem 0.75rem; border-bottom:1px solid var(--border); color:var(--text); white-space:nowrap; }
        .hourly-table tr:last-child td { border-bottom:none; }
        .hourly-table tr:hover td { background:var(--bg); }
        .day-row td { background:var(--bg) !important; color:var(--text-muted); font-size:0.78rem; font-style:italic; font-weight:600; }
        .temp-val { font-weight:600; color:var(--accent); }
        .precip-hi { color:#4a90d9; font-weight:600; }

        /* ── Empty state ── */
        .empty-state { text-align:center; padding:5rem 2rem; color:var(--text-muted); }
        .empty-state h2 { font-size:1.1rem; margin-bottom:0.5rem; color:var(--text); }

        @media (max-width:580px) {
            .hourly-table th:nth-child(3),
            .hourly-table td:nth-child(3) { display:none; }
        }
    </style>
</head>
<body class="dark"><script>if(localStorage.getItem('theme')==='light')document.body.classList.remove('dark');</script>
<div class="page-wrap">
    <page-topbar title="Weather" subtitle="Hourly forecasts — data from the National Weather Service." status-banner></page-topbar>

    <div class="loc-tabs" id="locTabs">
        <button class="loc-tab-btn" data-tab="west">West</button>
        <button class="loc-tab-btn" data-tab="rockies">Rockies</button>
        <button class="loc-tab-btn" data-tab="plains">Plains</button>
        <button class="loc-tab-btn" data-tab="appalachians">Appalachians</button>
        <button class="loc-tab-btn active" data-tab="east">East</button>
        <button class="loc-tab-btn" data-tab="custom">Custom</button>
    </div>

    <div id="locBar"></div>


    <div id="forecastArea"></div>
</div>

<script>

// ─── Preset locations ────────────────────────────────────────────────────────
// bold:true  → shown by default; bold:false → hidden behind "..."
// default:true → selected on tab switch
const PRESETS = {

  ],

    { key:'22835', zip:'22835', label:'Shenandoah',     bold:true  },

  ],
  plains: [
    { key:'78701', zip:'78701', label:'Austin',         bold:true  },
    { key:'58501', zip:'58501', label:'Bismarck',       bold:false },
    { key:'75201', zip:'75201', label:'Dallas',         bold:false },
    { key:'58102', zip:'58102', label:'Fargo',          bold:false },
    { key:'77001', zip:'77001', label:'Houston',        bold:false },
    { key:'64101', zip:'64101', label:'Kansas City',    bold:true  },
    { key:'55401', zip:'55401', label:'Minneapolis',    bold:true, default:true },
    { key:'73101', zip:'73101', label:'Oklahoma City',  bold:true  },
    { key:'68101', zip:'68101', label:'Omaha',          bold:false },
    { key:'67201', zip:'67201', label:'Wichita',        bold:false },
  ],
  rockies: [
    { key:'83701', zip:'83701', label:'Boise',          bold:false },
    { key:'59715', zip:'59715', label:'Bozeman',        bold:false },
    { key:'80202', zip:'80202', label:'Denver',         bold:true  },
    { key:'59937', zip:'59937', label:'Glacier NP',     bold:true  },
    { key:'83001', zip:'83001', label:'Grand Teton',    bold:true, default:true },
    { key:'84532', zip:'84532', label:'Moab',           bold:true  },
    { key:'84101', zip:'84101', label:'Salt Lake City', bold:false },
    { key:'87501', zip:'87501', label:'Santa Fe',       bold:false },
    { key:'87571', zip:'87571', label:'Taos',           bold:false },
    { key:'81435', zip:'81435', label:'Telluride',      bold:false },
  ],
  west: [
    { key:'97701', zip:'97701', label:'Bend',           bold:false },
    { key:'93920', zip:'93920', label:'Big Sur',        bold:false },
    { key:'90001', zip:'90001', label:'Los Angeles',    bold:true, default:true },
    { key:'98362', zip:'98362', label:'Olympic NP',     bold:true  },
    { key:'85001', zip:'85001', label:'Phoenix',        bold:false },
    { key:'97201', zip:'97201', label:'Portland',       bold:false },
    { key:'92101', zip:'92101', label:'San Diego',      bold:false },
    { key:'94102', zip:'94102', label:'San Francisco',  bold:true  },
    { key:'98101', zip:'98101', label:'Seattle',        bold:true  },
    { key:'86336', zip:'86336', label:'Sedona',         bold:false },
  ],
  // hidden for now:
  europe: [],
  asia:   [],
};

// ─── State ───────────────────────────────────────────────────────────────────
const ZIPS_KEY = 'weather-zips';
const GEO_KEY  = 'weather-geo';
let savedZips  = (() => { try { return JSON.parse(localStorage.getItem(ZIPS_KEY) || '[]'); } catch(e) { return []; } })();
let geoCache   = (() => { try { return JSON.parse(localStorage.getItem(GEO_KEY)  || '{}'); } catch(e) { return {}; } })();

const LAST_KEY   = 'weather-last';
const lastVisited = (() => { try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch(e) { return null; } })();
// find which tab the saved key belongs to
const lastTab    = lastVisited ? (Object.entries(PRESETS).find(([, list]) => list.some(p => p.key === lastVisited))?.[0] || 'east') : 'east';
let activeTab    = lastTab;
let activeKey    = lastVisited || PRESETS.east.find(p => p.default)?.key || PRESETS.east[0]?.key || null;
const expandedTabs = new Set();
const forecastCache = new Map();
let chart       = null;
let showHours   = 24;
const metrics   = { temp: true, precip: true, wind: false, humid: false };
let lastPeriods = null;

function saveZips()     { localStorage.setItem(ZIPS_KEY, JSON.stringify(savedZips)); }
function saveGeoCache() { localStorage.setItem(GEO_KEY,  JSON.stringify(geoCache));  }

// ─── Geo lookup ───────────────────────────────────────────────────────────────
async function getGeo(key) {
  if (geoCache[key]) return geoCache[key];
  const custom = savedZips.find(z => z.zip === key);
  if (custom) { geoCache[key] = custom; saveGeoCache(); return custom; }
  const geo = await fetchGeo(key);
  geoCache[key] = geo;
  saveGeoCache();
  return geo;
}

// ─── Status banner ───────────────────────────────────────────────────────────
const _topbar = document.querySelector('page-topbar');

// ─── Location tabs ────────────────────────────────────────────────────────────
document.getElementById('locTabs').addEventListener('click', e => {
  const btn = e.target.closest('.loc-tab-btn');
  if (!btn) return;
  document.querySelectorAll('.loc-tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  if (activeTab === 'custom') {
    activeKey = savedZips[0]?.zip || null;
  } else {
    const list = PRESETS[activeTab] || [];
    activeKey = (list.find(p => p.default) || list[0])?.key || null;
  }
  renderLocBar();
  if (activeKey) loadForecast(activeKey); else renderEmpty();
});

// ─── Location bar ─────────────────────────────────────────────────────────────
function renderLocBar() {
  const container = document.getElementById('locBar');
  container.innerHTML = '';

  if (activeTab === 'custom') {
    const bar = document.createElement('div');
    bar.className = 'zip-bar';
    savedZips.forEach(z => {
      const chip = document.createElement('div');
      chip.className = 'zip-chip' + (z.zip === activeKey ? ' active' : '');
      chip.innerHTML = `<span class="chip-label">${z.city ? `${z.city}, ${z.state}` : z.zip}</span>
        <button class="chip-remove" title="Remove ${z.zip}">×</button>`;
      chip.querySelector('.chip-label').addEventListener('click', () => {
        activeKey = z.zip; renderLocBar(); loadForecast(z.zip);
      });
      chip.querySelector('.chip-remove').addEventListener('click', e => {
        e.stopPropagation();
        savedZips = savedZips.filter(x => x.zip !== z.zip);
        forecastCache.delete(z.zip);
        saveZips();
        if (activeKey === z.zip) activeKey = savedZips[0]?.zip || null;
        renderLocBar();
        if (activeKey) loadForecast(activeKey); else renderEmpty();
      });
      bar.appendChild(chip);
    });
    const form = document.createElement('div');
    form.className = 'zip-add-form';
    form.innerHTML = `<input class="zip-input" id="zipInput" type="text" placeholder="90210 (lol 80s)" maxlength="5" inputmode="numeric">
      <button class="btn-add-zip" id="btnAddZip">+ Add zip</button>`;
    bar.appendChild(form);
    container.appendChild(bar);
    document.getElementById('btnAddZip').addEventListener('click', addZip);
    document.getElementById('zipInput').addEventListener('keydown', e => { if (e.key === 'Enter') addZip(); });
    return;
  }

  // ── Preset tab ──
  const list = PRESETS[activeTab] || [];
  if (!list.length) {
    container.innerHTML = `<div class="loc-bar"><span class="loc-bar-empty">No locations yet.</span></div>`;
    return;
  }

  const isExpanded = expandedTabs.has(activeTab);
  const toShow     = isExpanded ? list : list.filter(p => p.bold);
  const hasHidden  = list.some(p => !p.bold);

  const bar = document.createElement('div');
  bar.className = 'loc-bar';

  toShow.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'loc-link' + (p.key === activeKey ? ' active' : '') + (p.bold ? ' bold-loc' : '');
    btn.textContent = p.label;
    btn.addEventListener('click', () => { activeKey = p.key; renderLocBar(); loadForecast(p.key); });
    bar.appendChild(btn);
  });

  if (hasHidden) {
    const toggle = document.createElement('button');
    toggle.className = 'loc-link loc-expand';
    if (!isExpanded) {
      toggle.textContent = '···';
      toggle.title = 'Show all';
      toggle.addEventListener('click', () => { expandedTabs.add(activeTab); renderLocBar(); });
    } else {
      toggle.textContent = '«';
      toggle.title = 'Show fewer';
      toggle.addEventListener('click', () => { expandedTabs.delete(activeTab); renderLocBar(); });
    }
    bar.appendChild(toggle);
  }

  container.appendChild(bar);
}

// ─── Add zip (custom) ────────────────────────────────────────────────────────
async function addZip() {
  const input = document.getElementById('zipInput');
  const zip = input.value.replace(/\D/g, '').slice(0, 5);
  if (zip.length !== 5) { _topbar.showStatus('Enter a 5-digit US zip code.', true); return; }
  if (savedZips.find(z => z.zip === zip)) {
    input.value = ''; activeKey = zip; renderLocBar(); loadForecast(zip); return;
  }
  _topbar.showStatus(`Looking up ${zip}…`);
  try {
    const geo = await fetchGeo(zip);
    savedZips.push(geo); saveZips();
    activeKey = zip; input.value = '';
    renderLocBar(); await loadForecast(zip);
  } catch(e) { _topbar.showStatus(e.message, true); }
}

// ─── Geocoding ────────────────────────────────────────────────────────────────
async function fetchGeo(zip) {
  const r = await fetch(`https://api.zippopotam.us/us/${zip}`);
  if (!r.ok) throw new Error(`Zip code ${zip} not found — must be a valid US zip.`);
  const d = await r.json();
  const p = d.places[0];
  return {
    zip,
    lat:   parseFloat(p.latitude),
    lng:   parseFloat(p.longitude),
    city:  p.place_name  || p['place-name']  || '',
    state: p.state_abbreviation || p['state abbreviation'] || '',
  };
}

// ─── NWS forecast ────────────────────────────────────────────────────────────
const NWS_UA  = { 'User-Agent': 'dmtaub.github.io/weather (dmtaub@gmail.com)' };
const CACHE_TTL = 30 * 60 * 1000;

async function loadForecast(key) {
  const hit = forecastCache.get(key);
  if (hit && Date.now() - hit.ts < CACHE_TTL) {
    lastPeriods = hit.periods; renderForecast(key, hit.periods); _topbar.hideStatus(); return;
  }
  _topbar.showStatus(`Fetching forecast…`);
  try {
    const z   = await getGeo(key);
    const pts = await fetch(`https://api.weather.gov/points/${z.lat},${z.lng}`, { headers: NWS_UA });
    if (!pts.ok) throw new Error('NWS lookup failed — location may lack NWS coverage.');
    const ptsJ = await pts.json();
    const hr   = await fetch(ptsJ.properties.forecastHourly, { headers: NWS_UA });
    if (!hr.ok) throw new Error('Could not load hourly forecast data.');
    const periods = (await hr.json()).properties.periods;
    forecastCache.set(key, { periods, ts: Date.now() });
    lastPeriods = periods;
    localStorage.setItem(LAST_KEY, JSON.stringify(key));
    renderForecast(key, periods);
    _topbar.hideStatus();
  } catch(e) { _topbar.showStatus(e.message, true); }
}

// ─── Forecast render ─────────────────────────────────────────────────────────
function renderForecast(key, periods) {
  const preset  = Object.values(PRESETS).flat().find(p => p.key === key);
  const cached  = geoCache[key];
  const locName = preset?.label || (cached?.city ? `${cached.city}${cached.state ? ', ' + cached.state : ''}` : key);

  const now    = periods.slice(0, showHours);
  const cur    = periods[0];
  const labels = now.map(p => new Date(p.startTime).toLocaleTimeString([], { hour:'numeric', hour12:true }));
  const temps  = now.map(p => p.temperature);
  const precip = now.map(p => p.probabilityOfPrecipitation?.value ?? 0);
  const wind   = now.map(p => parseFloat(p.windSpeed) || 0);
  const humid  = now.map(p => p.relativeHumidity?.value ?? 0);

  const area = document.getElementById('forecastArea');
  area.innerHTML = `
    <div class="forecast-header">
      <div class="forecast-location">${locName}</div>
      <div class="forecast-current">
        Currently ${cur.temperature}°F &middot; ${cur.shortForecast} &middot; Wind ${cur.windSpeed} ${cur.windDirection}
      </div>
    </div>
    <div class="chart-controls">
      <div class="toggle-group">
        <button class="toggle-btn ${showHours===24?'active':''}" data-hours="24">24h</button>
        <button class="toggle-btn ${showHours===48?'active':''}" data-hours="48">48h</button>
        <button class="toggle-btn ${showHours===96?'active':''}" data-hours="96">4d</button>
        <button class="toggle-btn ${showHours===168?'active':''}" data-hours="168">7d</button>
      </div>
      <span class="controls-spacer"></span>
      <div class="toggle-group">
        <button class="toggle-btn ${metrics.temp?'active':''}"   data-metric="temp">Temp</button>
        <button class="toggle-btn ${metrics.precip?'active':''}" data-metric="precip">Precip</button>
        <button class="toggle-btn ${metrics.wind?'active':''}"   data-metric="wind">Wind</button>
        <button class="toggle-btn ${metrics.humid?'active':''}"  data-metric="humid">Humidity</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="wxChart" height="130"></canvas></div>
    <div class="hourly-wrap">${buildTable(now)}</div>`;

  area.querySelectorAll('[data-hours]').forEach(btn => btn.addEventListener('click', () => {
    showHours = +btn.dataset.hours; renderForecast(key, periods);
  }));
  area.querySelectorAll('[data-metric]').forEach(btn => btn.addEventListener('click', () => {
    metrics[btn.dataset.metric] = !metrics[btn.dataset.metric]; renderForecast(key, periods);
  }));
  drawChart(labels, temps, precip, wind, humid);
}

// ─── Chart ───────────────────────────────────────────────────────────────────
function cssVar(name) {
  return (getComputedStyle(document.documentElement).getPropertyValue(name)
       || getComputedStyle(document.body).getPropertyValue(name)).trim();
}

function drawChart(labels, temps, precip, wind, humid) {
  if (chart) { chart.destroy(); chart = null; }
  const ctx   = document.getElementById('wxChart').getContext('2d');
  const grid  = cssVar('--border')     || 'rgba(128,128,128,.2)';
  const muted = cssVar('--text-muted') || '#888';
  const acc   = cssVar('--accent')     || '#7c6ccd';

  const datasets = [];
  if (metrics.temp) datasets.push({
    type:'line', label:'Temp (°F)', data:temps, yAxisID:'yL',
    borderColor:acc, backgroundColor:'transparent',
    pointRadius:2, pointHoverRadius:5, tension:0.35, borderWidth:2, order:1,
  });
  if (metrics.precip) datasets.push({
    type:'bar', label:'Precip (%)', data:precip, yAxisID:'yR',
    backgroundColor:'rgba(74,144,217,.3)', borderColor:'rgba(74,144,217,.65)',
    borderWidth:1, order:3,
  });
  if (metrics.wind) datasets.push({
    type:'line', label:'Wind (mph)', data:wind, yAxisID:'yR',
    borderColor:'#5db85d', backgroundColor:'transparent',
    pointRadius:2, tension:0.35, borderWidth:1.5, borderDash:[5,3], order:2,
  });
  if (metrics.humid) datasets.push({
    type:'line', label:'Humidity (%)', data:humid, yAxisID:'yR',
    borderColor:'#e09b3d', backgroundColor:'transparent',
    pointRadius:2, tension:0.35, borderWidth:1.5, borderDash:[2,3], order:2,
  });

  chart = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive:true,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ labels:{ color:muted, font:{size:12}, boxWidth:14, padding:14 } },
        tooltip:{ callbacks:{ label: c => {
          const v = c.parsed.y, l = c.dataset.label;
          if (l.startsWith('Temp'))   return ` ${v}°F`;
          if (l.startsWith('Precip')) return ` ${v}% chance of rain`;
          if (l.startsWith('Wind'))   return ` ${v} mph`;
          if (l.startsWith('Humid'))  return ` ${v}%`;
          return ` ${v}`;
        }}},
      },
      scales:{
        x:{ ticks:{ color:muted, maxTicksLimit:showHours<=24?12:showHours<=48?16:24, font:{size:11} }, grid:{ color:grid } },
        yL:{ type:'linear', position:'left',  display:metrics.temp,
             ticks:{ color:acc,  font:{size:11}, callback:v=>v+'°' }, grid:{ color:grid } },
        yR:{ type:'linear', position:'right', display:metrics.precip||metrics.wind||metrics.humid,
             min:0, max:100,
             ticks:{ color:muted, font:{size:11}, callback:v=>v+'%' }, grid:{ drawOnChartArea:false } },
      },
    },
  });
}

// ─── Hourly table ─────────────────────────────────────────────────────────────
function buildTable(periods) {
  let lastDay = '';
  const rows = periods.map(p => {
    const d   = new Date(p.startTime);
    const day = d.toLocaleDateString([], { weekday:'long', month:'short', day:'numeric' });
    const time= d.toLocaleTimeString([], { hour:'numeric', hour12:true });
    const pr  = p.probabilityOfPrecipitation?.value ?? 0;
    const hu  = p.relativeHumidity?.value ?? '—';
    let out = '';
    if (day !== lastDay) { lastDay = day; out += `<tr class="day-row"><td colspan="6">${day}</td></tr>`; }
    out += `<tr>
      <td>${time}</td>
      <td class="temp-val">${p.temperature}°F</td>
      <td>${p.shortForecast}</td>
      <td class="${pr >= 30 ? 'precip-hi' : ''}">${pr > 0 ? pr + '%' : '—'}</td>
      <td>${p.windSpeed} ${p.windDirection}</td>
      <td>${hu}%</td>
    </tr>`;
    return out;
  }).join('');
  return `<table class="hourly-table">
    <thead><tr><th>Time</th><th>Temp</th><th>Conditions</th><th>Precip</th><th>Wind</th><th>Humidity</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ─── Empty state ──────────────────────────────────────────────────────────────
function renderEmpty() {
  document.getElementById('forecastArea').innerHTML = `
    <div class="empty-state">
      <h2>No locations saved yet</h2>
      <p>Enter a US zip code above to get started.</p>
    </div>`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.loc-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
renderLocBar();
if (activeKey) loadForecast(activeKey); else renderEmpty();
</script>
<script src="./util.js"></script>
