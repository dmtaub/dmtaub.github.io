<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer — Utils</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./util.css">
    <script src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>
    <script type="importmap">
    {
        "imports": {
            "preact":       "https://esm.sh/preact@10",
            "preact/hooks": "https://esm.sh/preact@10/hooks",
            "htm":          "https://esm.sh/htm@3"
        }
    }
    </script>
    <style>
        :root { --page-max-width: 1400px; }

        /* ── Sequencer theming ───────────────────────────────────────────────
           Two themes — "slate" (self-contained palette) and "default" (maps
           onto the site theme.css tokens). Each has a light and dark variant;
           the light/dark variant follows the site-wide `body.dark` toggle.
           Variables live on [data-seq-theme] so a single attribute swap
           re-skins the whole app. The "default" theme delegates to the site
           tokens, so it follows body.dark automatically.
           ──────────────────────────────────────────────────────────────────── */

        /* slate — light (used when body is not .dark) */
        [data-seq-theme="slate"] {
            --sq-card-bg:        rgba(255, 255, 255, 0.95);
            --sq-card-border:    rgba(100, 116, 139, 0.25);
            --sq-card-shadow:    0 10px 30px rgba(0, 0, 0, 0.12);
            --sq-text:           #1e293b;
            --sq-text-muted:     #64748b;
            --sq-text-dim:       #94a3b8;
            --sq-label:          #475569;
            --sq-control-bg:     #ffffff;
            --sq-control-border: rgba(100, 116, 139, 0.3);
            --sq-tile-bg:        rgba(241, 245, 249, 0.85);
            --sq-tile-border:    rgba(100, 116, 139, 0.2);
            --sq-inset-bg:       rgba(226, 232, 240, 0.8);
            --sq-accent:         #4338ca;
            --sq-accent-active:  #2563eb;
            --sq-danger:         #b91c1c;
            --sq-secondary:      #e2e8f0;
            --sq-on-accent:      #ffffff;
            --sq-highlight:      #4f46e5;
            --sq-hover-bg:       rgba(99, 102, 241, 0.15);
            --sq-selected-bg:    rgba(99, 102, 241, 0.18);
            --sq-fill:           #4338ca;
            --sq-float-bg:       rgba(255, 255, 255, 0.8);
        }
        /* slate — dark (the original look) */
        body.dark [data-seq-theme="slate"] {
            --sq-card-bg:        rgba(17, 24, 39, 0.92);
            --sq-card-border:    rgba(148, 163, 184, 0.2);
            --sq-card-shadow:    0 10px 30px rgba(0, 0, 0, 0.3);
            --sq-text:           #eef2ff;
            --sq-text-muted:     #94a3b8;
            --sq-text-dim:       #64748b;
            --sq-label:          #cbd5e1;
            --sq-control-bg:     rgba(15, 23, 42, 1);
            --sq-control-border: rgba(148, 163, 184, 0.25);
            --sq-tile-bg:        rgba(15, 23, 42, 0.65);
            --sq-tile-border:    rgba(148, 163, 184, 0.18);
            --sq-inset-bg:       rgba(30, 41, 59, 0.7);
            --sq-accent:         #4338ca;
            --sq-accent-active:  #2563eb;
            --sq-danger:         #7f1d1d;
            --sq-secondary:      #1f2937;
            --sq-on-accent:      #eef2ff;
            --sq-highlight:      #818cf8;
            --sq-hover-bg:       rgba(99, 102, 241, 0.25);
            --sq-selected-bg:    rgba(99, 102, 241, 0.2);
            --sq-fill:           rgba(238, 242, 255, 0.85);
            --sq-float-bg:       rgba(15, 23, 42, 0.75);
        }
        /* default — inherits the site palette, follows body.dark via theme.css */
        [data-seq-theme="default"] {
            --sq-card-bg:        var(--surface);
            --sq-card-border:    var(--border);
            --sq-card-shadow:    0 10px 30px var(--shadow);
            --sq-text:           var(--text);
            --sq-text-muted:     var(--text-muted);
            --sq-text-dim:       var(--text-muted);
            --sq-label:          var(--text-muted);
            --sq-control-bg:     var(--bg);
            --sq-control-border: var(--border);
            --sq-tile-bg:        var(--bg);
            --sq-tile-border:    var(--border);
            --sq-inset-bg:       var(--bg);
            --sq-accent:         var(--accent);
            --sq-accent-active:  var(--accent-soft);
            --sq-danger:         #b91c1c;
            --sq-secondary:      var(--bg);
            --sq-on-accent:      #ffffff;
            --sq-highlight:      var(--accent);
            --sq-hover-bg:       rgba(138, 123, 159, 0.18);
            --sq-selected-bg:    rgba(138, 123, 159, 0.22);
            --sq-fill:           var(--accent);
            --sq-float-bg:       var(--surface);
        }

        .panel-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: 1fr;
        }

        .card {
            background: var(--sq-card-bg);
            border: 1px solid var(--sq-card-border);
            border-radius: 16px;
            box-shadow: var(--sq-card-shadow);
        }
        .card-header { padding: 20px 20px 8px; }
        .card-content { padding: 20px; container-type: inline-size; }

        .badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            border: 1px solid var(--sq-card-border);
            background: var(--sq-inset-bg);
            color: var(--sq-text);
        }

        .controls-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            margin-bottom: 16px;
        }
        @media (max-width: 1100px) { .controls-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px)  { .controls-grid { grid-template-columns: 1fr; } }

        .toolbar-row {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 1fr;
            align-items: end;
            margin-bottom: 16px;
        }
        @media (max-width: 700px) { .toolbar-row { grid-template-columns: 1fr; } }

        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
            
        }

        .field label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--sq-label);
        }
        .field input[type="range"] { width: 100%; accent-color: var(--sq-accent); }

        .seq-select {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--sq-control-border);
            background: var(--sq-control-bg);
            color: var(--sq-text);
            padding: 4px 8px;
            font: inherit;
            font-size: 12px;
        }
        .seq-select { text-align-last: center; }
        .seq-select.small { padding: 1px 2px; font-size: 8px; }
        @container (min-width: 140px) { .seq-select.small { font-size: 10px; } }
        @container (min-width: 200px) { .seq-select.small { font-size: 12px; padding: 2px 4px; } }

        /* ── Custom progression dropdown ── */
        .prog-select {
            width: 100%; border: 1px solid var(--sq-control-border);
            border-radius: 8px; overflow: hidden; background: var(--sq-control-bg);
        }
        .prog-option {
            display: grid; grid-template-columns: 1rem 1fr 1rem;
            align-items: center; gap: 0;
            padding: 4px 8px; cursor: pointer; font-size: 11px;
            color: var(--sq-label); transition: background 0.1s;
        }
        .prog-option:hover { background: var(--sq-hover-bg); color: var(--sq-text); }
        .prog-option.selected { background: var(--sq-selected-bg); color: var(--sq-text); }
        .prog-option .po-left  { text-align: right; color: var(--sq-text-dim); font-size: 10px; }
        .prog-option .po-mid   { text-align: center; font-weight: 700; font-size: 13px; color: var(--sq-text); }
        .prog-option .po-right { text-align: left;  color: var(--sq-text-dim); font-size: 10px; }

        .btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 10px;
            border: 1px solid var(--sq-card-border);
            background: var(--sq-control-bg);
            color: var(--sq-text);
            font: inherit;
            font-size: 13px;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        .btn:hover { opacity: 0.8; }
        .btn.primary   { background: var(--sq-accent); border-color: var(--sq-accent); color: var(--sq-on-accent); }
        .btn.secondary { background: var(--sq-secondary); }
        .btn.danger    { background: var(--sq-danger); border-color: var(--sq-danger); color: #fff; }
        .btn.active    { background: var(--sq-accent-active); border-color: var(--sq-accent-active); color: #fff; }

        .tile-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .tile-grid.cols-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
        @media (max-width: 900px)  { .tile-grid.cols-8 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @container (max-width: 560px) { .tile-grid, .tile-grid.cols-8 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .tile {
            container-type: inline-size;
            border: 1px solid var(--sq-tile-border);
            border-radius: 14px;
            padding: 10px;
            background: var(--sq-tile-bg);
            color: var(--sq-text);
            animation: fadeUp 0.25s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .tile-numeral { text-align: center; font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--sq-text); }
        .tile-title { text-align: center; font-size: 11px; color: var(--sq-text-dim); margin: 4px 0 2px; }
        .tile-tiny  { text-align: center; font-size: 11px; color: var(--sq-text-dim); }
        .tile-controls { display: grid; gap: 7px; margin-top: 7px; }
        .tile-actions {
            display: flex; gap: 5px; flex-wrap: wrap;
            justify-content: center; margin-top: 6px;
        }
        .tile-actions .oct-btns {
            display: flex; gap: 5px; flex-shrink: 0;
        }

        .small-btn {
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 7px;
            border: 1px solid var(--sq-control-border);
            background: var(--sq-control-bg);
            color: var(--sq-text);
            cursor: pointer;
            font: inherit;
        }
        .small-btn:hover { opacity: 0.8; }

        .note-bar {
            height: 90px;
            width: 100%;
            border-radius: 10px;
            border: 0;
            background: var(--sq-inset-bg);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 7px;
            cursor: pointer;
        }
        .note-bar-fill {
            width: 26px;
            border-radius: 7px 7px 0 0;
            background: var(--sq-fill);
            min-height: 4px;
            transition: height 0.15s;
        }

        .staff-btn {
            width: 100%;
            height: 90px;
            border: 0;
            border-radius: 10px;
            background: var(--sq-inset-bg);
            cursor: pointer;
            color: var(--sq-text);
            display: block;
        }

        .sidebar-list { display: grid; gap: 10px; }
        .sidebar-item {
            border: 1px solid var(--sq-tile-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--sq-text-muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .progression-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .progression-label { font-size: 12px; color: var(--sq-text-dim); }

        .status-dot {
            font-size: 12px;
            padding: 4px 12px;
            border: 1px solid var(--sq-card-border);
            border-radius: 999px;
            color: var(--sq-text);
            background: var(--sq-inset-bg);
        }

        .transport-float {
            position: fixed;
            top: 5rem;
            right: 2rem;
            z-index: 200;
            background: var(--sq-float-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--sq-card-border);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .transport-float .action-row { margin-bottom: 0; flex-wrap: nowrap; }
        .transport-float .status-dot {
            background: transparent;
            border-color: var(--sq-control-border);
        }
        .transport-minimize {
            background: none; border: none; color: var(--sq-text-dim);
            cursor: pointer; font-size: 18px; padding: 0 0 0 8px;
            line-height: 1; flex-shrink: 0;
        }
        .transport-minimize:hover { color: var(--sq-text); }
        .transport-mini {
            display: flex; gap: 5px;
        }
        .transport-mini .btn {
            padding: 0; font-size: 33px;
            width: 34px; height: 34px;
            justify-content: center;
            padding-bottom: 4px;
            padding-left: 2px;
        }
        .transport-mini .btn.primary {
            font-size: 14px;
            padding-top: 5px;
        }
        .transport-mini .btn.danger {
            font-size: 22px;
            padding-bottom: 4px;
            padding-right: 2px;
        }

        .card h2 { color: var(--sq-text); margin: 0 0 4px; font-size: 16px; }
        .page-title    { color: var(--text); }
        .page-subtitle { color: var(--text-muted); }
    </style>
</head>
<body class="dark">
    <script>if(localStorage.getItem('theme')==='light')document.body.classList.remove('dark');</script>

    <div class="page-wrap">
        <div class="topbar">
            <a class="back-link" href="./">← Utils</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☀</button>
        </div>
        <h1 class="page-title">Sequencer</h1>
        <p class="page-subtitle">Generate melodic ideas, flip into chord mode, audition inversions, and export as MIDI.</p>
        <div id="app"></div>
    </div>

    <script type="module">
    // @ts-check
    import { h, render, Fragment } from 'preact';
    import { useState, useEffect, useMemo, useRef } from 'preact/hooks';
    import htm from 'htm';
    const html = htm.bind(h);

    /* ── Types (JSDoc) ───────────────────────────────────────────────────────── */

    /** @typedef {'1n'|'1/2n'|'1/4n'|'1/8n'} DurationName */
    /** @typedef {'major'|'minor'|'dorian'|'pentatonic'} ScaleName */
    /** @typedef {'triad'|'seventh'|'maj7'|'min7'|'dom7'|'dim7'|'aug5'|'add9'|'plusm7plus9'} ChordVariantName */

    /**
     * @typedef {Object} MelodyItem
     * @property {number} degree
     * @property {string} note
     * @property {DurationName} duration
     * @property {number} inversion
     * @property {number} octaveShift
     * @property {ChordVariantName} chordVariant
     */

    /**
     * @typedef {Object} EventItem
     * @property {number} time
     * @property {DurationName} duration
     * @property {number} degree
     * @property {number} inversion
     * @property {number} octaveShift
     * @property {string[]} notes
     * @property {string} chordLabel
     */

    /**
     * @typedef {Object} ProgressionOption
     * @property {number} degree
     * @property {string} label
     * @property {number} prevShared
     * @property {number} nextShared
     * @property {number} totalShared
     * @property {number} prevPercent
     * @property {number} nextPercent
     */

    /**
     * @typedef {Object} MelodySettings
     * @property {string} key
     * @property {ScaleName} scale
     * @property {number} length
     * @property {number} surprise
     */

    /* ── Constants ───────────────────────────────────────────────────────────── */

    const KEYS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
    const LENGTHS = [4, 8, 16, 32];
    /** @type {DurationName[]} */
    const DURATION_OPTIONS = ['1/8n', '1/4n', '1/2n', '1n'];
    const ROMAN_NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

    /** @type {Record<ScaleName, {label: string, intervals: number[]}>} */
    const SCALES = {
        major:      { label: 'Major',        intervals: [0, 2, 4, 5, 7, 9, 11] },
        minor:      { label: 'Natural Minor', intervals: [0, 2, 3, 5, 7, 8, 10] },
        dorian:     { label: 'Dorian',        intervals: [0, 2, 3, 5, 7, 9, 10] },
        pentatonic: { label: 'Pentatonic',    intervals: [0, 2, 4, 7, 9] },
    };

    /** @type {Record<ChordVariantName, {label: string, suffix: string}>} */
    const CHORD_VARIANTS = {
        triad:       { label: 'Triad',  suffix: '' },
        seventh:     { label: '7th',    suffix: '7' },
        maj7:        { label: 'M7',     suffix: 'maj7' },
        min7:        { label: 'm7',     suffix: 'm7' },
        dom7:        { label: '7',      suffix: '7' },
        dim7:        { label: 'dim7',   suffix: 'dim7' },
        aug5:        { label: 'aug5',   suffix: 'aug5' },
        add9:        { label: 'add9',   suffix: 'add9' },
        plusm7plus9: { label: '+m7+9',  suffix: '+m7+9' },
    };

    /* ── Engine ──────────────────────────────────────────────────────────────── */

    /** @type {Record<string, number>} */
    const NOTE_TO_SEMITONE = {
        C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5,
        'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11,
    };
    const SEMITONE_TO_NAME = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
    /** @type {Record<string, number>} */
    const DURATION_TO_BEATS = { '1/8n': 0.5, '1/4n': 1, '1/2n': 2, '1n': 4 };
    /** @type {Record<string, number[]>} */
    const CHORD_QUALITIES = { major: [0, 4, 7], minor: [0, 3, 7], diminished: [0, 3, 6] };

    /**
     * @template T
     * @param {Array<{value: T, weight: number}>} items
     * @returns {T}
     */
    function weightedChoice(items) {
        const total = items.reduce((s, i) => s + i.weight, 0);
        let r = Math.random() * total;
        for (const item of items) { r -= item.weight; if (r <= 0) return item.value; }
        return items[items.length - 1].value;
    }

    /**
     * @param {number} v
     * @param {number} lo
     * @param {number} hi
     * @returns {number}
     */
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    /** @param {number} midi @returns {string} */
    function midiToNoteName(midi) {
        const m = clamp(Math.round(midi), 0, 127);
        return `${SEMITONE_TO_NAME[m % 12]}${Math.floor(m / 12) - 1}`;
    }

    /** @param {string} noteName @returns {number} */
    function noteNameToMidi(noteName) {
        const match = noteName.match(/^([A-G](?:#|b)?)(-?\d+)$/);
        if (!match) return 60;
        return (parseInt(match[2], 10) + 1) * 12 + (NOTE_TO_SEMITONE[match[1]] ?? 0);
    }

    /** @param {string} noteName @returns {{letter:string, accidental:string, octave:number}} */
    function parseNoteName(noteName) {
        const match = noteName.match(/^([A-G])([#b]?)(-?\d+)$/);
        if (!match) return { letter: 'C', accidental: '', octave: 4 };
        return { letter: match[1], accidental: match[2], octave: parseInt(match[3], 10) };
    }

    /** @param {string} noteName @returns {number} */
    function noteNameToStaffStep(noteName) {
        const { letter, octave } = parseNoteName(noteName);
        const steps = /** @type {Record<string,number>} */({ C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 });
        return octave * 7 + (steps[letter] ?? 0);
    }

    /** @param {string} noteName @returns {string} */
    function getAccidentalForNote(noteName) { return parseNoteName(noteName).accidental; }

    /** @param {number} v @returns {string} */
    function formatOctaveShift(v) { return v > 0 ? `+${v}` : `${v}`; }

    /** @param {DurationName} d @returns {number} */
    function durationToSliderIndex(d) { return DURATION_OPTIONS.indexOf(d); }

    /** @param {number} i @returns {DurationName} */
    function sliderIndexToDuration(i) { return DURATION_OPTIONS[clamp(i, 0, DURATION_OPTIONS.length - 1)] ?? '4n'; }

    /**
     * @param {string} root
     * @param {ScaleName} scaleName
     * @param {number} degree
     * @param {number} [octaveBase]
     * @returns {number}
     */
    function scaleDegreeToMidi(root, scaleName, degree, octaveBase = 4) {
        const scale = SCALES[scaleName].intervals;
        const scaleLen = scale.length;
        const n = Math.max(0, degree);
        return 12 * (octaveBase + 1 + Math.floor(n / scaleLen)) + (NOTE_TO_SEMITONE[root] ?? 0) + scale[n % scaleLen];
    }

    /**
     * @param {ScaleName} scaleName
     * @param {number} degree
     * @returns {'major'|'minor'|'diminished'}
     */
    function getChordQualityFromDegree(scaleName, degree) {
        const intervals = SCALES[scaleName].intervals;
        const scaleLen = intervals.length;
        const idx = ((degree % scaleLen) + scaleLen) % scaleLen;
        const root  = intervals[idx];
        const third = intervals[(idx + 2) % scaleLen];
        const fifth = intervals[(idx + 4) % scaleLen];
        const thirdD = (third - root + 12) % 12;
        const fifthD = (fifth - root + 12) % 12;
        if (thirdD === 4 && fifthD === 7) return 'major';
        if (thirdD === 3 && fifthD === 7) return 'minor';
        return 'diminished';
    }

    /**
     * @param {'major'|'minor'|'diminished'} quality
     * @param {ChordVariantName} variant
     * @returns {number[]}
     */
    function getChordIntervalsForVariant(quality, variant) {
        if (variant === 'triad')   return CHORD_QUALITIES[quality] ?? CHORD_QUALITIES.major;
        if (variant === 'seventh') return quality === 'major' ? [0,4,7,11] : quality === 'minor' ? [0,3,7,10] : [0,3,6,10];
        if (variant === 'maj7')    return quality === 'minor' ? [0,3,7,10] : quality === 'diminished' ? [0,3,6,10] : [0,4,7,11];
        if (variant === 'min7')    return quality === 'major' ? [0,4,7,10] : quality === 'diminished' ? [0,3,6,10] : [0,3,7,10];
        if (variant === 'dom7')    return quality === 'minor' ? [0,3,7,10] : quality === 'diminished' ? [0,3,6,9]  : [0,4,7,10];
        if (variant === 'dim7')    return quality === 'major' ? [0,4,7,10] : [0,3,6,9];
        if (variant === 'aug5')    return quality === 'minor' ? [0,3,8] : [0,4,8];
        if (variant === 'add9')    return quality === 'minor' ? [0,3,7,14] : quality === 'diminished' ? [0,3,6,14] : [0,4,7,14];
        return quality === 'minor' ? [0,3,8,10,14] : quality === 'diminished' ? [0,3,6,9,14] : [0,4,8,10,14];
    }

    /**
     * @param {'major'|'minor'|'diminished'} quality
     * @param {ChordVariantName} variant
     * @returns {string}
     */
    function getChordVariantSuffix(quality, variant) {
        if (variant === 'triad')   return quality === 'major' ? '' : quality === 'minor' ? 'm' : 'dim';
        if (variant === 'seventh') return quality === 'major' ? 'maj7' : quality === 'minor' ? 'm7' : 'm7b5';
        return CHORD_VARIANTS[variant].suffix;
    }

    /**
     * @param {string} rootKey
     * @param {ScaleName} scaleName
     * @param {number} degree
     * @param {number} [inversion]
     * @param {number} [octaveShift]
     * @param {ChordVariantName} [chordVariant]
     * @returns {{quality: string, notes: number[], label: string}}
     */
    function buildChordFromDegree(rootKey, scaleName, degree, inversion = 0, octaveShift = 0, chordVariant = 'triad') {
        const rootMidi = scaleDegreeToMidi(rootKey, scaleName, degree, 4) + octaveShift * 12;
        const quality  = getChordQualityFromDegree(scaleName, degree);
        const voiced   = getChordIntervalsForVariant(quality, chordVariant).map(i => rootMidi + i);
        for (let i = 0; i < inversion; i++) voiced[i % voiced.length] += 12;
        voiced.sort((a, b) => a - b);
        const rootName = midiToNoteName(rootMidi).replace(/\d+$/, '');
        const suffix   = getChordVariantSuffix(quality, chordVariant);
        return { quality, notes: voiced, label: (rootName + (suffix ? ` ${suffix}` : '')).trim() };
    }

    /**
     * @param {ScaleName} scaleName
     * @param {number} degree
     * @returns {string}
     */
    function getRomanNumeral(scaleName, degree) {
        const intervals = SCALES[scaleName].intervals;
        const scaleLen  = intervals.length;
        const idx       = ((degree % scaleLen) + scaleLen) % scaleLen;
        const quality   = getChordQualityFromDegree(scaleName, degree);
        let numeral = ROMAN_NUMERALS[idx] ?? 'I';
        if (quality === 'minor')      numeral = numeral.toLowerCase();
        if (quality === 'diminished') numeral = numeral.toLowerCase() + '°';
        return numeral;
    }

    /**
     * @param {MelodyItem[]} melody
     * @param {ScaleName} scaleName
     * @returns {string}
     */
    function getProgressionLabel(melody, scaleName) {
        return melody.map(item => getRomanNumeral(scaleName, item.degree)).join(' – ');
    }

    /** @returns {'rising'|'falling'|'arch'|'valley'|'wander'} */
    function generateContour() {
        const shapes = /** @type {const} */(['rising', 'falling', 'arch', 'valley', 'wander']);
        return shapes[Math.floor(Math.random() * shapes.length)];
    }

    /**
     * @param {'rising'|'falling'|'arch'|'valley'|'wander'} shape
     * @param {number} i
     * @param {number} length
     * @returns {number}
     */
    function contourBias(shape, i, length) {
        const t = i / Math.max(1, length - 1);
        if (shape === 'rising')  return t * 2 - 1;
        if (shape === 'falling') return 1 - t * 2;
        if (shape === 'arch')    return 1 - Math.abs(t - 0.5) * 4;
        if (shape === 'valley')  return Math.abs(t - 0.5) * 4 - 1;
        return 0;
    }

    /**
     * @param {MelodyItem} item
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @param {number} [nextDegree]
     * @returns {MelodyItem}
     */
    function syncItemNoteToDegree(item, keyRoot, scale, nextDegree = item.degree) {
        return { ...item, degree: nextDegree, note: midiToNoteName(scaleDegreeToMidi(keyRoot, scale, nextDegree, 4)) };
    }

    /** @param {MelodySettings} args @returns {MelodyItem[]} */
    function generateMelody(args) {
        const contour  = generateContour();
        const motifLen = Math.min(4, Math.max(3, Math.floor(args.length / 4)));
        /** @type {number[]} */ const motif = [];
        let degree = weightedChoice([{ value: 0, weight: 6 }, { value: 2, weight: 4 }, { value: 4, weight: 4 }]);

        for (let i = 0; i < motifLen; i++) {
            const lw   = args.surprise / 100;
            const move = weightedChoice([
                { value: 0,  weight: 2 }, { value: 1,  weight: 6 }, { value: -1, weight: 6 },
                { value: 2,  weight: 2 + lw * 5 }, { value: -2, weight: 2 + lw * 5 },
                { value: 3,  weight: 1 + lw * 3 }, { value: -3, weight: 1 + lw * 3 },
            ]);
            const bias = contourBias(contour, i, motifLen);
            if (bias >  0.35) degree += Math.random() < 0.65 ? 1 : 0;
            if (bias < -0.35) degree -= Math.random() < 0.65 ? 1 : 0;
            degree = clamp(degree + move, 0, 11);
            motif.push(degree);
        }

        const durWeights = [
            { value: /** @type {DurationName} */('1/8n'), weight: 4 },
            { value: /** @type {DurationName} */('1/4n'), weight: 7 },
            { value: /** @type {DurationName} */('1/2n'), weight: 3 },
            { value: /** @type {DurationName} */('1n'), weight: 1 },
        ];
        /** @type {MelodyItem[]} */ const phrase = [];
        for (let i = 0; i < args.length; i++) {
            let d = motif[i % motifLen];
            if (i >= motifLen && Math.random() < 0.35)
                d += weightedChoice([{ value: 0, weight: 5 }, { value: 1, weight: 2 }, { value: -1, weight: 2 }]);
            d = clamp(d, 0, 11);
            phrase.push({
                degree: d, note: midiToNoteName(scaleDegreeToMidi(args.key, args.scale, d, 4)),
                duration: weightedChoice(durWeights), inversion: 0, octaveShift: 0,
                chordVariant: /** @type {ChordVariantName} */('triad'),
            });
        }
        const cadence = weightedChoice([{ value: 0, weight: 7 }, { value: 2, weight: 3 }, { value: 4, weight: 4 }]);
        phrase[phrase.length - 1] = {
            degree: cadence, note: midiToNoteName(scaleDegreeToMidi(args.key, args.scale, cadence, 4)),
            duration: '1/2n', inversion: 0, octaveShift: 0, chordVariant: 'triad',
        };
        return phrase;
    }

    /** @param {MelodyItem[]} melody @returns {MelodyItem[]} */
    function mutateMelody(melody) {
        return melody.map((note, i, arr) => {
            if (i === arr.length - 1) return note;
            if (Math.random() < 0.28) {
                const midi = clamp(noteNameToMidi(note.note) + (Math.random() < 0.5 ? -1 : 1), 48, 84);
                return { ...note, note: midiToNoteName(midi) };
            }
            return note;
        });
    }

    /** @param {MelodyItem[]} melody @returns {number} */
    function totalBeats(melody) {
        return melody.reduce((s, item) => s + (DURATION_TO_BEATS[item.duration] ?? 1), 0);
    }

    /**
     * @param {MelodyItem[]} melody
     * @param {boolean} chordMode
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @returns {EventItem[]}
     */
    function melodyToEvents(melody, chordMode, keyRoot, scale) {
        let cursor = 0;
        return melody.map(item => {
            const base = { time: cursor, duration: item.duration, degree: item.degree, inversion: item.inversion || 0, octaveShift: item.octaveShift || 0 };
            cursor += DURATION_TO_BEATS[item.duration] ?? 1;
            if (chordMode) {
                const chord = buildChordFromDegree(keyRoot, scale, item.degree, item.inversion || 0, item.octaveShift || 0, item.chordVariant);
                return { ...base, notes: chord.notes.map(midiToNoteName), chordLabel: chord.label };
            }
            const midi = noteNameToMidi(item.note) + (item.octaveShift || 0) * 12;
            return { ...base, notes: [midiToNoteName(midi)], chordLabel: midiToNoteName(midi) };
        });
    }

    /**
     * @param {MelodyItem[]} melody
     * @param {boolean} chordMode
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @returns {{min: number, max: number}}
     */
    function pitchStats(melody, chordMode, keyRoot, scale) {
        const values = melody.flatMap(item => chordMode
            ? buildChordFromDegree(keyRoot, scale, item.degree, item.inversion || 0, item.octaveShift || 0, item.chordVariant).notes
            : [noteNameToMidi(item.note) + (item.octaveShift || 0) * 12]);
        return { min: Math.min(...values), max: Math.max(...values) };
    }

    /**
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @param {number} degree
     * @param {ChordVariantName} chordVariant
     * @returns {Set<number>}
     */
    function getPitchClassSet(keyRoot, scale, degree, chordVariant) {
        return new Set(buildChordFromDegree(keyRoot, scale, degree, 0, 0, chordVariant).notes.map(n => ((n % 12) + 12) % 12));
    }

    /**
     * @param {Set<number>|undefined} a
     * @param {Set<number>|undefined} b
     * @returns {number}
     */
    function countShared(a, b) {
        if (!a || !b) return 0;
        let n = 0; a.forEach(v => { if (b.has(v)) n++; }); return n;
    }

    /**
     * @param {MelodyItem[]} melody
     * @param {number} index
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @param {ChordVariantName} chordVariant
     * @returns {ProgressionOption[]}
     */
    function getProgressionOptions(melody, index, keyRoot, scale, chordVariant) {
        const scaleLen = SCALES[scale].intervals.length;
        const len = melody.length;
        const prevItem = melody[(index - 1 + len) % len];
        const nextItem = melody[(index + 1) % len];
        const prev = prevItem ? getPitchClassSet(keyRoot, scale, prevItem.degree, prevItem.chordVariant) : undefined;
        const next = nextItem ? getPitchClassSet(keyRoot, scale, nextItem.degree, nextItem.chordVariant) : undefined;
        return Array.from({ length: scaleLen }, (_, degree) => {
            const candidate = getPitchClassSet(keyRoot, scale, degree, chordVariant);
            const size = candidate.size;
            const prevSh = countShared(candidate, prev);
            const nextSh = countShared(candidate, next);
            const numeral = getRomanNumeral(scale, degree);
            const prevPct = size ? Math.round((prevSh / size) * 100) : 0;
            const nextPct = size ? Math.round((nextSh / size) * 100) : 0;
            const lp  = `${prevPct}%`.padStart(4);
            const rp  = `${nextPct}%`.padEnd(4);
            const mid = numeral.length >= 3 ? numeral : numeral.padStart(Math.ceil((3 + numeral.length) / 2)).padEnd(3);
            return { degree, label: `${lp} | ${mid} | ${rp}`, prevShared: prevSh, nextShared: nextSh, totalShared: prevSh + nextSh, prevPercent: prevPct, nextPercent: nextPct };
        }).sort((a, b) => a.degree - b.degree);
    }

    /* ── MIDI export ─────────────────────────────────────────────────────────── */

    /** @param {number} value @returns {number[]} */
    function encodeVarLen(value) {
        let buf = value & 0x7f;
        const bytes = [];
        while ((value >>= 7)) { buf <<= 8; buf |= (value & 0x7f) | 0x80; }
        while (true) { bytes.push(buf & 0xff); if (buf & 0x80) buf >>= 8; else break; }
        return bytes;
    }

    /**
     * @param {MelodyItem[]} melody
     * @param {boolean} chordMode
     * @param {string} keyRoot
     * @param {ScaleName} scale
     * @param {number} tempo
     * @returns {Blob}
     */
    function makeMidiFile(melody, chordMode, keyRoot, scale, tempo) {
        const tpq   = 480;
        const micro = Math.round(60000000 / tempo);
        /** @type {Array<{tick:number, bytes:number[]}>} */
        const events = [{ tick: 0, bytes: [0xff, 0x51, 0x03, (micro >> 16) & 0xff, (micro >> 8) & 0xff, micro & 0xff] }];
        melodyToEvents(melody, chordMode, keyRoot, scale).forEach(ev => {
            const start = Math.round(ev.time * tpq);
            const dur   = Math.round((DURATION_TO_BEATS[ev.duration] ?? 1) * tpq);
            ev.notes.map(noteNameToMidi).forEach(midi => {
                events.push({ tick: start,       bytes: [0x90, midi, 100] });
                events.push({ tick: start + dur, bytes: [0x80, midi, 0]   });
            });
        });
        events.sort((a, b) => a.tick - b.tick || a.bytes[0] - b.bytes[0]);
        let last = 0;
        /** @type {number[]} */ const track = [];
        for (const ev of events) { track.push(...encodeVarLen(ev.tick - last), ...ev.bytes); last = ev.tick; }
        track.push(0x00, 0xff, 0x2f, 0x00);
        const header = [0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 0, 0, 1, (tpq >> 8) & 0xff, tpq & 0xff];
        const trkHdr = [0x4d, 0x54, 0x72, 0x6b, (track.length >> 24) & 0xff, (track.length >> 16) & 0xff, (track.length >> 8) & 0xff, track.length & 0xff];
        return new Blob([new Uint8Array([...header, ...trkHdr, ...track])], { type: 'audio/midi' });
    }

    /* ── Player ──────────────────────────────────────────────────────────────── */

    class MelodyPlayer {
        constructor() {
            /** @type {any} */
            this.synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'triangle' },
                envelope:   { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.9 },
            }).toDestination();
            /** @type {any} */ this.part = null;
        }

        /**
         * @param {string[]|string} notes
         * @param {string} [duration]
         */
        async preview(notes, duration = '1/2n') {
            await Tone.start();
            this.synth.triggerAttackRelease(notes, duration, Tone.now(), Array.isArray(notes) ? 0.7 : 0.9);
        }

        /**
         * @param {MelodyItem[]} melody
         * @param {boolean} chordMode
         * @param {string} keyRoot
         * @param {ScaleName} scale
         * @param {number} bpm
         * @param {boolean} [loop]
         * @returns {Promise<number>}
         */
        async play(melody, chordMode, keyRoot, scale, bpm, loop = false, onIndex = null) {
            await Tone.start();
            this.stop();
            const events = melodyToEvents(melody, chordMode, keyRoot, scale);
            Tone.Transport.bpm.value = bpm;
            this.part = new Tone.Part((time, /** @type {any} */ value) => {
                this.synth.triggerAttackRelease(value.notes, value.duration, time, chordMode ? 0.65 : 0.85);
                if (onIndex) Tone.getDraw().schedule(() => onIndex(value.index), time);
            }, events.map((ev, i) => ({ ...ev, index: i }))).start(0);
            this.part.loop    = loop;
            this.part.loopEnd = totalBeats(melody);
            Tone.Transport.start();
            return totalBeats(melody);
        }

        stop() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            if (this.part) { this.part.dispose(); this.part = null; }
            this.synth.releaseAll();
        }

        dispose() { this.stop(); this.synth.dispose(); }
    }

    /* ── Components ──────────────────────────────────────────────────────────── */

    /**
     * @param {{ notes: number[], onClick: () => void }} props
     */
    /**
     * @param {{ options: Array<{degree:number,label:string,prevPercent:number,nextPercent:number}>,
     *            value: number, onChange: (d:number)=>void }} props
     */
    function ProgSelect({ options, value, onChange }) {
        const numeral = (o) => o.label.split('|')[1]?.trim() ?? String(o.degree);
        return html`
            <div class="prog-select">
                ${options.map(o => html`
                    <div key=${o.degree}
                         class=${`prog-option${o.degree === value ? ' selected' : ''}`}
                         onClick=${() => onChange(o.degree)}>
                        <span class="po-left">${o.prevPercent}%</span>
                        <span class="po-mid">${numeral(o)}</span>
                        <span class="po-right">${o.nextPercent}%</span>
                    </div>
                `)}
            </div>`;
    }

    function StaffChordView({ notes, onClick }) {
        const noteNames      = [...notes].sort((a, b) => a - b).map(midiToNoteName);
        const staffLineSteps = [30, 32, 34, 36, 38];
        const bottomStep     = 28;
        /** @param {number} step @returns {number} */
        const getY = step => 88 - (step - bottomStep) * 4;

        return html`
            <button class="staff-btn" onClick=${onClick} title="Click to cycle inversion">
                <svg viewBox="0 0 120 100" style="width:100%;height:100%;overflow:visible" aria-hidden="true">
                    ${staffLineSteps.map(s => html`
                        <line key=${s} x1="12" y1=${getY(s)} x2="108" y2=${getY(s)}
                              stroke="currentColor" stroke-opacity="0.25" stroke-width="2" />`)}
                    ${noteNames.map((name, idx) => {
                        const step = noteNameToStaffStep(name);
                        const y    = getY(step);
                        const acc  = getAccidentalForNote(name);
                        const x    = 30 + idx * 30;
                        const ledgers = [];
                        if (step < staffLineSteps[0])
                            for (let s = staffLineSteps[0] - 2; s >= step; s -= 2) ledgers.push(s);
                        if (step > staffLineSteps[staffLineSteps.length - 1])
                            for (let s = staffLineSteps[staffLineSteps.length - 1] + 2; s <= step; s += 2) ledgers.push(s);
                        return html`
                            <g key=${`${name}-${idx}`}>
                                ${ledgers.map(ls => html`<line key=${ls} x1=${x-12} y1=${getY(ls)} x2=${x+12} y2=${getY(ls)} stroke="currentColor" stroke-width="2" />`)}
                                ${acc && html`<text x=${x-14} y=${y+4} font-size="14" text-anchor="middle" fill="currentColor">${acc}</text>`}
                                <ellipse cx=${x} cy=${y} rx="7" ry="5.5" fill="currentColor" fill-opacity="0.9" transform=${`rotate(-18 ${x} ${y})`} />
                                <line x1=${x+7} y1=${y} x2=${x+7} y2=${y-28} stroke="currentColor" stroke-width="2" />
                            </g>`;
                    })}
                </svg>
            </button>`;
    }

    /**
     * @param {{
     *   item: MelodyItem, index: number, melody: MelodyItem[],
     *   keyRoot: string, scale: ScaleName, chordMode: boolean,
     *   stats: {min:number, max:number},
     *   onCycleInv: (i:number)=>void, onOctUp: (i:number)=>void, onOctDown: (i:number)=>void,
     *   onPreview: (i:number)=>void, onDegree: (i:number, d:number)=>void,
     *   onChordVariant: (i:number, v:ChordVariantName)=>void, onDuration: (i:number, d:DurationName)=>void
     * }} props
     */
    function Tile({ item, index, melody, keyRoot, scale, chordMode, stats,
                    onCycleInv, onOctUp, onOctDown, onPreview, onDegree, onChordVariant, onDuration }) {
        const chord    = buildChordFromDegree(keyRoot, scale, item.degree, item.inversion || 0, item.octaveShift || 0, item.chordVariant);
        const midis    = chordMode ? chord.notes : [noteNameToMidi(item.note) + (item.octaveShift || 0) * 12];
        const numeral  = getRomanNumeral(scale, item.degree);
        const name     = chordMode ? chord.label : midiToNoteName(midis[0]);
        const progOpts = getProgressionOptions(melody, index, keyRoot, scale, item.chordVariant);
        const invCount = buildChordFromDegree(keyRoot, scale, item.degree, 0, item.octaveShift || 0, item.chordVariant).notes.length;
        const range    = Math.max(1, stats.max - stats.min);
        const pct      = ((midis[0] - stats.min) / range) * 80 + 20;

        return html`
            <div class="tile">
                <div class="tile-numeral">${numeral}</div>
                ${chordMode
                    ? html`<${StaffChordView} notes=${midis} onClick=${() => onCycleInv(index)} />`
                    : html`<button class="note-bar" onClick=${() => onCycleInv(index)} title="Click to cycle inversion">
                               <div class="note-bar-fill" style=${{ height: `${pct.toFixed(1)}%` }}></div>
                           </button>`}
                <div class="tile-title">${name}</div>
                <div class="tile-controls">
                    <div class="field">
                        <label class="tile-tiny">Progression</label>
                        <${ProgSelect} options=${progOpts} value=${item.degree} onChange=${d => onDegree(index, d)} />
                    </div>
                    ${chordMode && html`<div class="field">
                        <label class="tile-tiny">Chord</label>
                        <select class="seq-select small" value=${item.chordVariant} onChange=${e => onChordVariant(index, e.target.value)}>
                            ${Object.entries(CHORD_VARIANTS).map(([v, cfg]) => html`<option key=${v} value=${v}>${cfg.label}</option>`)}
                        </select>
                    </div>`}
                    <div class="field">
                        <label class="tile-tiny">Duration: ${item.duration}</label>
                        <input type="range" min="0" max=${DURATION_OPTIONS.length - 1} step="1"
                               value=${durationToSliderIndex(item.duration)}
                               onChange=${e => onDuration(index, sliderIndexToDuration(parseInt(e.target.value, 10)))} />
                        <div class="tile-tiny" style="display:flex;justify-content:space-between">
                            <span>1/8n</span><span>1/4n</span><span>1/2n</span><span>1n</span>
                        </div>
                    </div>
                </div>
                <div class="tile-actions">
                    <button class="small-btn" style="flex:2;min-width:0" onClick=${() => onPreview(index)}>🔊</button>
                    <span class="oct-btns">
                        <button class="small-btn" onClick=${() => onOctDown(index)}>-8</button>
                        <button class="small-btn" onClick=${() => onOctUp(index)}>+8</button>
                    </span>
                </div>
                ${chordMode
                    ? html`<div class="tile-tiny">Inversion ${(item.inversion || 0) + 1}/${invCount} · Octave ${formatOctaveShift(item.octaveShift || 0)}</div>`
                    : html`<div class="tile-tiny">Octave ${formatOctaveShift(item.octaveShift || 0)}</div>`}
            </div>`;
    }

    /* ── App ─────────────────────────────────────────────────────────────────── */

    function TransportFloat({ isPlaying, loopEnabled, onPlay, onStop, onLoop }) {
        const [mini, setMini] = useState(true);

        return html`
            <div class="transport-float">
                ${mini
                    ? html`<div class="transport-mini">
                        <button class="btn primary"   onClick=${onPlay}>▶</button>
                        <button class="btn danger"    onClick=${onStop}>■</button>
                        <button class=${loopEnabled ? 'btn active' : 'btn secondary'} onClick=${onLoop}>⟳</button>
                        <button class="transport-minimize" onClick=${() => setMini(m => !m)}>▾</button>
                    </div>`
                    : html`<${Fragment}>
                        <div class="action-row">
                            <button class="btn primary" onClick=${onPlay}>▶ Play</button>
                            <button class="btn danger"  onClick=${onStop}>■ Stop</button>
                            <button class=${loopEnabled ? 'btn active' : 'btn secondary'} onClick=${onLoop}>
                                ⟳ ${loopEnabled ? 'Looping' : 'Loop Off'}
                            </button>
                            <button class="transport-minimize" onClick=${() => setMini(m => !m)}>▴</button>

                        </div>
                        <div style="display:flex;align-items:center;justify-content:flex-end">
                            <span class="status-dot">${isPlaying ? 'Now playing' : 'Ready'}</span>
                        </div>
                    <//>`
                }
            </div>`;
    }

    function App() {
        const [keyRoot,           setKeyRoot]           = useState('C');
        const [scale,             setScale]             = useState(/** @type {ScaleName} */('minor'));
        const [length,            setLength]            = useState(16);
        const [tempo,             setTempo]             = useState(100);
        const [surprise,          setSurprise]          = useState(28);
        const [loopEnabled,       setLoopEnabled]       = useState(false);
        const [isPlaying,         setIsPlaying]         = useState(false);
        const [playingIndex,      setPlayingIndex]      = useState(-1);
        const [chordMode,         setChordMode]         = useState(false);
        const [globalChordVariant, setGlobalChordVariant] = useState(/** @type {ChordVariantName} */('triad'));
        const [seqTheme,          setSeqTheme]          = useState(
            /** @type {'slate'|'default'} */(localStorage.getItem('seqTheme') !== 'default' ? 'slate' : 'default'));
        const [melody,            setMelody]            = useState(() =>
            generateMelody({ key: 'C', scale: 'minor', length: 16, surprise: 28 }));

        /** @type {{ current: MelodyPlayer|null }} */
        const playerRef   = useRef(null);
        /** @type {{ current: ReturnType<typeof setTimeout>|null }} */
        const stopTimerRef = useRef(null);

        useEffect(() => {
            playerRef.current = new MelodyPlayer();
            return () => {
                playerRef.current?.dispose();
                if (stopTimerRef.current !== null) clearTimeout(stopTimerRef.current);
            };
        }, []);

        useEffect(() => {
            setMelody(cur => cur.map(item => syncItemNoteToDegree(item, keyRoot, scale)));
        }, [keyRoot, scale]);

        useEffect(() => {
            Tone.Transport.bpm.value = tempo;
        }, [tempo]);

        useEffect(() => {
            localStorage.setItem('seqTheme', seqTheme);
        }, [seqTheme]);

        const stats     = useMemo(() => pitchStats(melody, chordMode, keyRoot, scale), [melody, chordMode, keyRoot, scale]);
        const progLabel = useMemo(() => getProgressionLabel(melody, scale), [melody, scale]);

        const stopPlayback = () => {
            playerRef.current?.stop();
            if (stopTimerRef.current !== null) { clearTimeout(stopTimerRef.current); stopTimerRef.current = null; }
            setIsPlaying(false);
            setPlayingIndex(-1);
        };

        const play = async () => {
            if (!playerRef.current) return;
            stopPlayback();
            const beats = await playerRef.current.play(melody, chordMode, keyRoot, scale, tempo, loopEnabled, setPlayingIndex);
            setIsPlaying(true);
            if (!loopEnabled) {
                const ms = (60 / tempo) * beats * 1000 + 250;
                stopTimerRef.current = setTimeout(() => { setIsPlaying(false); stopTimerRef.current = null; }, ms);
            }
        };

        const regenerate = () => setMelody(
            generateMelody({ key: keyRoot, scale, length, surprise }).map(item => ({ ...item, chordVariant: globalChordVariant })));

        const vary = () => setMelody(cur => mutateMelody(cur));

        const cycleInversion = (/** @type {number} */ index) => setMelody(cur => cur.map((item, i) => {
            if (i !== index) return item;
            const count = buildChordFromDegree(keyRoot, scale, item.degree, 0, item.octaveShift || 0, item.chordVariant).notes.length;
            return { ...item, inversion: ((item.inversion || 0) + 1) % Math.max(1, count) };
        }));

        const shiftOctaveUp   = (/** @type {number} */ index) => setMelody(cur => cur.map((item, i) => i === index ? { ...item, octaveShift: (item.octaveShift || 0) + 1 } : item));
        const shiftOctaveDown = (/** @type {number} */ index) => setMelody(cur => cur.map((item, i) => i === index ? { ...item, octaveShift: (item.octaveShift || 0) - 1 } : item));

        const updateDuration = (/** @type {number} */ index, /** @type {DurationName} */ next) =>
            setMelody(cur => cur.map((item, i) => i === index ? { ...item, duration: next } : item));

        const updateDegree = (/** @type {number} */ index, /** @type {number} */ next) =>
            setMelody(cur => cur.map((item, i) => i === index ? syncItemNoteToDegree(item, keyRoot, scale, next) : item));

        const updateChordVariant = (/** @type {number} */ index, /** @type {ChordVariantName} */ next) =>
            setMelody(cur => cur.map((item, i) => {
                if (i !== index) return item;
                const count = buildChordFromDegree(keyRoot, scale, item.degree, 0, item.octaveShift || 0, next).notes.length;
                return { ...item, chordVariant: next, inversion: (item.inversion || 0) % Math.max(1, count) };
            }));

        const updateAllChordVariants = (/** @type {ChordVariantName} */ next) => {
            setGlobalChordVariant(next);
            setMelody(cur => cur.map(item => {
                const count = buildChordFromDegree(keyRoot, scale, item.degree, 0, item.octaveShift || 0, next).notes.length;
                return { ...item, chordVariant: next, inversion: (item.inversion || 0) % Math.max(1, count) };
            }));
        };

        const previewItem = async (/** @type {number} */ index) => {
            const item = melody[index];
            if (!item || !playerRef.current) return;
            if (chordMode) {
                const chord = buildChordFromDegree(keyRoot, scale, item.degree, item.inversion || 0, item.octaveShift || 0, item.chordVariant);
                await playerRef.current.preview(chord.notes.map(midiToNoteName), item.duration);
            } else {
                const midi = noteNameToMidi(item.note) + (item.octaveShift || 0) * 12;
                await playerRef.current.preview(midiToNoteName(midi), item.duration);
            }
        };

        const exportMidi = () => {
            const blob = makeMidiFile(melody, chordMode, keyRoot, scale, tempo);
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = `sequencer-${keyRoot}-${scale}-${chordMode ? 'chords' : 'melody'}.mid`;
            a.click(); URL.revokeObjectURL(url);
        };

        return html`
            <div data-seq-theme=${seqTheme}>
            <${TransportFloat}
                isPlaying=${isPlaying} loopEnabled=${loopEnabled}
                onPlay=${play} onStop=${stopPlayback}
                onLoop=${() => setLoopEnabled(v => !v)} />
            <div class="panel-grid">
                <section class="card">
                    <div class="card-header">
                        <div class="badges">
                            <span class="badge">${keyRoot} ${SCALES[scale].label}</span>
                            <span class="badge">${tempo} BPM</span>
                            <span class="badge">${chordMode ? 'Chord Mode' : 'Single Notes'}</span>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="controls-grid">
                            <div class="field">
                                <label>Key</label>
                                <select class="seq-select" value=${keyRoot} onChange=${e => setKeyRoot(e.target.value)}>
                                    ${KEYS.map(k => html`<option key=${k} value=${k}>${k}</option>`)}
                                </select>
                            </div>
                            <div class="field">
                                <label>Scale</label>
                                <select class="seq-select" value=${scale} onChange=${e => setScale(e.target.value)}>
                                    ${Object.entries(SCALES).map(([v, cfg]) => html`<option key=${v} value=${v}>${cfg.label}</option>`)}
                                </select>
                            </div>
                            <div class="field">
                                <label>Phrase Length</label>
                                <select class="seq-select" value=${length} onChange=${e => setLength(parseInt(e.target.value, 10))}>
                                    ${LENGTHS.map(n => html`<option key=${n} value=${n}>${n} notes</option>`)}
                                </select>
                            </div>
                            ${chordMode && html`<div class="field">
                                <label>Chord Family</label>
                                <select class="seq-select" value=${globalChordVariant} onChange=${e => updateAllChordVariants(e.target.value)}>
                                    ${Object.entries(CHORD_VARIANTS).map(([v, cfg]) => html`<option key=${v} value=${v}>${cfg.label}</option>`)}
                                </select>
                            </div>`}
                            <div class="field">
                                <label>Theme</label>
                                <select class="seq-select" value=${seqTheme} onChange=${e => setSeqTheme(e.target.value)}>
                                    <option value="slate">Slate</option>
                                    <option value="default">Default</option>
                                </select>
                            </div>
                        </div>

                        <div class="toolbar-row">
                            <div style="display:grid;gap:10px">
                                <div class="field">
                                    <label>Tempo: ${tempo}</label>
                                    <input type="range" min="50" max="360" step="1" value=${tempo}
                                           onChange=${e => setTempo(parseInt(e.target.value, 10))} />
                                </div>
                                <div class="field">
                                    <label>Surprise: ${surprise}%</label>
                                    <input type="range" min="0" max="100" step="1" value=${surprise}
                                           onChange=${e => setSurprise(parseInt(e.target.value, 10))} />
                                </div>
                            </div>
                            <div style="display:grid;gap:10px">
                                <div class="action-row" style="margin-bottom:0">
                                    <button class="btn primary" onClick=${regenerate}>✦ Generate</button>
                                    <button class="btn secondary" onClick=${vary}>↻ Variation</button>
                                </div>
                                <div class="action-row" style="margin-bottom:0">
                                    <button class="btn secondary" onClick=${exportMidi}>↓ Export MIDI</button>
                                </div>
                            </div>
                        </div>

                        <div class="progression-bar">
                            <div>
                                <button class=${chordMode ? 'btn active' : 'btn secondary'}
                                        style="display:block;width:90%;margin:0.75rem auto 0.5rem;text-align:center;justify-content:center"
                                        onClick=${() => setChordMode(v => !v)}>
                                    ⊞ ${chordMode ? 'Phrase Mode' : 'Chord Mode'}
                                </button>
                                <div class="progression-label">
                                    Progression:${melody.map((item, i) => html`
                                        <span key=${i} style=${i === playingIndex ? 'color:var(--sq-highlight);font-weight:700' : ''}> ${getRomanNumeral(scale, item.degree)}</span>${i < melody.length - 1 ? ' –' : ''}
                                    `)}
                                </div>
                            </div>
                            <div class="progression-label">
                                Range: ${midiToNoteName(stats.min)} → ${midiToNoteName(stats.max)}
                            </div>
                        </div>

                        <div class=${`tile-grid${melody.length > 8 ? ' cols-8' : ''}`}>
                            ${melody.map((item, index) => html`
                                <${Tile} key=${index}
                                    item=${item} index=${index} melody=${melody}
                                    keyRoot=${keyRoot} scale=${scale} chordMode=${chordMode} stats=${stats}
                                    onCycleInv=${cycleInversion} onOctUp=${shiftOctaveUp} onOctDown=${shiftOctaveDown}
                                    onPreview=${previewItem} onDegree=${updateDegree}
                                    onChordVariant=${updateChordVariant} onDuration=${updateDuration} />`)}
                        </div>

                        <p class="tile-tiny" style="margin-top:12px;text-align:left">
                            Progression overlap shows percentages based on the number of notes in the currently selected chord variant, including loop wraparound.
                        </p>
                    </div>
                </section>

                <section class="card">
                    <div class="card-content sidebar-list">
                        <div class="sidebar-item">Use single-note mode to hear hook contour first, then switch to chord mode to see whether the harmony suggests a verse or chorus.</div>
                        <div class="sidebar-item">Try higher-overlap choices for smoother voice leading, then change the chord variant per tile to hear how sevenths, ninths, and altered fifths change the overlap ranking.</div>
                        <div class="sidebar-item">Longer durations can turn a busy phrase into something hooky. Shorter durations can make the same harmony feel like a riff instead of a pad.</div>
                        <div class="sidebar-item">Use the top-level Chord Family control when you want music-theory-based harmony across the whole phrase, then override individual tiles when one chord wants to break the pattern.</div>
                        <div class="sidebar-item">Export MIDI when something clicks, then drag it into your DAW and layer bass, drums, or a pad under it.</div>
                    </div>
                </section>
            </div>
            </div>`;
    }

    render(html`<${App} />`, document.getElementById('app'));
    </script>
    <script src="./util.js"></script>
</body>
</html>
