<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sun Weasel</title>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/",
                    "pewpew": "../pewpew/pewpew.min.js"
                }
            }
        </script>
        <style>
            html, body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
            canvas { display: block; margin: 0 auto; }
        </style>
    </head>
    <body data-game="sunweasel" data-module="true">
        <!-- Shared loader (registers ./sw.js, which importScripts ../lib/sw-core.js),
             prompts for the access code, then injects the decrypted sunweasel module,
             which imports the plaintext "pewpew" library and Three.js via the importmap. -->
        <script src="../lib/loader.js"></script>
    </body>
</html>
