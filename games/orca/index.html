<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Mobile hardening (keep min.html in step) — see docs/TOUCH_INPUT.md.
       user-scalable=no: a two-finger steer+dash would pinch-zoom the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Orca Underwater</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #000; height: 100%;
      overflow: hidden;
      /* The game reads drags as swimming input; without these the browser
         steals them for scroll/pull-to-refresh. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; display:flex; align-items:flex-start; justify-content:center; }
    canvas { image-rendering: pixelated; }
    .hint {
      position: fixed; left: 12px; bottom: 10px;
      color: rgba(255,255,255,0.7); font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      user-select: none; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      /* Clear of the home indicator so it is not half-hidden on a phone. */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body data-game="orca">
  <div id="game"></div>
  <div class="hint">Arrows/WASD: swim • Space: dash • Esc: pause</div>


  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="../lib/loader.js"></script>
</body>
</html>
