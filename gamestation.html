<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAME STATION</title>
  <!-- Pull the site's color tokens (--bg, --accent, ...) so the CRT matches the
       brand. The arcade screen is always the dark phosphor variant. -->
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Force the dark token set — a CRT is a dark screen by nature. */
    :root, html {
      --bg:           #100f1a;
      --surface:      #1c1b2a;
      --text:         #e8e4f0;
      --text-muted:   #9b96ae;
      --accent:       #9b8bbb;
      --accent-soft:  #7b6e9a;
      --header-text:  #e8e4f0;
      --locked:       #e0533f;  /* red phosphor for coin-gated games */
      --locked-soft:  #b23a2c;
      --credit:       #54e08a;  /* green phosphor when credits are banked */
      --credit-soft:  #39b06a;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: #08070d;
      color: var(--accent);
      font-family: "Courier New", "DejaVu Sans Mono", monospace;
      font-weight: 700;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      /* Subtle whole-screen power flicker */
      animation: flicker 6s steps(1) infinite;
    }

    /* The curved monitor "glass" holding everything */
    .screen {
      position: relative;
      width: min(720px, 92vw);
      padding: 48px clamp(20px, 6vw, 64px);
      background:q
        radial-gradient(120% 120% at 50% 0%, rgba(155,139,187,0.10) 0%, transparent 55%),
        var(--bg);
      border-radius: 22px / 36px;
      box-shadow:
        inset 0 0 120px rgba(0,0,0,0.9),
        inset 0 0 24px rgba(155,139,187,0.18),
        0 0 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    /* Static scanlines */
    .screen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.35) 3px, rgba(0,0,0,0.35) 4px);
      mix-blend-mode: multiply;
    }
    /* Rolling refresh bar + vignette */
    .screen::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background:
        radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.55) 100%),
        linear-gradient(rgba(155,139,187,0.10), rgba(155,139,187,0.10));
      background-size: 100% 100%, 100% 12px;
      background-repeat: no-repeat, repeat-y;
      animation: roll 8s linear infinite;
    }

    .content { position: relative; z-index: 3; }

    .title {
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: 0.35em; margin: 0 0 4px;
      text-shadow: 0 0 8px var(--accent), 0 0 22px rgba(155,139,187,0.5);
      animation: glitch 5.5s infinite steps(1);
    }
    .subtitle {
      color: var(--accent-soft); font-size: 12px; letter-spacing: 0.25em; margin: 0 0 28px;
      text-shadow: 0 0 6px rgba(155,139,187,0.4);
    }

    ul.menu { list-style: none; margin: 0 0 22px; padding: 0; }
    li.item {
      display: flex; align-items: baseline; gap: 14px;
      padding: 10px 14px;
      font-size: clamp(16px, 3.4vw, 22px);
      letter-spacing: 0.12em;
      color: var(--accent-soft);
      cursor: pointer;
      border: 1px solid transparent;
      text-shadow: 0 0 6px rgba(155,139,187,0.35);
      transition: color .08s, background .08s;
    }
    li.item .prompt { width: 1.2em; opacity: 0; }
    li.item .desc { margin-left: auto; font-size: 11px; letter-spacing: 0.15em; color: var(--text-muted); }

    /* Coin-gated (encrypted) games: red + locked until INSERT COIN */
    li.item.locked {
      color: var(--locked-soft);
      cursor: not-allowed;
      text-shadow: 0 0 6px rgba(224,83,63,0.45);
      animation: redflicker 3.7s steps(1) infinite;
    }
    li.item.locked .desc { color: var(--locked-soft); }
    li.item.locked .lock { margin-left: 8px; font-size: 12px; opacity: 0.8; }

    /* Unlocked encrypted games look like the rest (white-hot accent) */
    li.item.unlocked { color: var(--accent-soft); cursor: pointer; text-shadow: 0 0 6px rgba(155,139,187,0.35); animation: none; }
    li.item.unlocked .desc { color: var(--text-muted); }
    li.item.unlocked .lock { display: none; }

    li.item.sel {
      color: #fff;
      background: rgba(155,139,187,0.14);
      border-color: rgba(155,139,187,0.55);
      text-shadow: 0 0 10px var(--accent), 0 0 20px rgba(155,139,187,0.6);
    }
    li.item.sel .prompt { opacity: 1; animation: blink 1s steps(1) infinite; }
    li.item.sel .desc { color: var(--accent-soft); }

    /* INSERT COIN control */
    .coin {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-width: 13.5em;  /* hold width (≥ widest label) so INSERT COIN ↔ N CREDITS doesn't reflow */
      margin: 0 0 6px; padding: 9px 16px;
      font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.22em;
      color: var(--locked); background: transparent;
      border: 1px solid var(--locked-soft); border-radius: 4px;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(224,83,63,0.6);
      box-shadow: inset 0 0 18px rgba(224,83,63,0.12), 0 0 10px rgba(224,83,63,0.18);
      animation: redflicker 2.3s steps(1) infinite;
    }
    .coin:hover, .coin:focus { background: rgba(224,83,63,0.12); outline: none; }
    .coin[hidden] { display: none; }
    .coin .slot { animation: blink 0.9s steps(1) infinite; }

    /* Credits in the bank → green instead of red */
    .coin.credited {
      color: var(--credit); border-color: var(--credit-soft);
      text-shadow: 0 0 8px rgba(84,224,138,0.6);
      box-shadow: inset 0 0 18px rgba(84,224,138,0.12), 0 0 10px rgba(84,224,138,0.18);
      animation: none;
    }
    .coin.credited:hover, .coin.credited:focus { background: rgba(84,224,138,0.12); }

    .hint {
      color: var(--text-muted); font-size: 11px; letter-spacing: 0.2em; margin-top: 16px;
      text-shadow: 0 0 5px rgba(155,139,187,0.3);
    }
    .hint .blink { animation: blink 1.1s steps(1) infinite; }
    .back { display: inline-block; margin-top: 14px; color: var(--accent-soft); text-decoration: none; font-size: 11px; letter-spacing: 0.2em; }
    .back:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.82; } 97.5% { opacity: 1; } 98% { opacity: 0.9; }
    }
    @keyframes redflicker {
      0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.55; } 93.6% { opacity: 1; } 96% { opacity: 0.7; } 96.5% { opacity: 1; }
    }
    @keyframes roll { 0% { background-position: 0 0, 0 -100%; } 100% { background-position: 0 0, 0 100%; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes glitch {
      0%, 94%, 100% { transform: none; text-shadow: 0 0 8px var(--accent), 0 0 22px rgba(155,139,187,0.5); }
      94.5% { transform: translate(-2px, 0); text-shadow: 2px 0 #ff3b6b, -2px 0 #3bd1ff; }
      95%   { transform: translate(2px, 0);  text-shadow: -2px 0 #ff3b6b, 2px 0 #3bd1ff; }
      95.5% { transform: translate(-1px, 0); text-shadow: 1px 0 #ff3b6b, -1px 0 #3bd1ff; }
      96%   { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .title, .screen::after, li.item.sel .prompt, li.item.locked, .coin, .hint .blink { animation: none; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="content">
      <h1 class="title">GAME STATION</h1>
      <p class="subtitle">▓ SELECT GAME ▓</p>

      <button class="coin" id="coin" type="button">
        <span class="slot">◉</span> <span class="coin-label" id="coinLabel">INSERT COIN</span>
      </button>

      <ul class="menu" id="menu">
        <li class="item" data-href="boxadon.html">
          <span class="prompt">&gt;</span><span class="name">BOXADON</span>
          <span class="desc">PUZZLER / PHASER</span>
        </li>
        <li class="item" data-href="games/pewpew/">
          <span class="prompt">&gt;</span><span class="name">PEWPEW</span>
          <span class="desc">SPACE / THREE.JS</span>
        </li>
        <li class="item locked" data-locked data-href="games/orca/">
          <span class="prompt">&gt;</span><span class="name">ORCA</span>
          <span class="desc">DEEP SEA / WASM</span><span class="lock">🔒</span>
        </li>
        <li class="item locked" data-locked data-href="games/sun-weasel/">
          <span class="prompt">&gt;</span><span class="name">SUN WEASEL</span>
          <span class="desc">RAIL SHOOTER / WASM</span><span class="lock">🔒</span>
        </li>
      </ul>

      <p class="hint">↑ ↓ MOVE &nbsp;·&nbsp; ENTER START &nbsp;·&nbsp; CLICK SELECT<span class="blink">_</span></p>
      <a class="back" href="index.html">&lt; BACK TO DMTAUB.COM</a>
    </div>
  </div>

  <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
      var coin = document.getElementById('coin');
      var coinLabel = document.getElementById('coinLabel');
      var CREDITS_KEY = 'gamestation_credits';
      var UNLOCK_KEY = 'gamestation_unlocked';
      var PLAY_COST = 1;          // every game costs 1 credit to play
      var UNLOCK_AT = 10;         // coin-gated games unlock once you bank 10
      var credits = parseInt(localStorage.getItem(CREDITS_KEY), 10) || 0;
      var unlocked = localStorage.getItem(UNLOCK_KEY) === '1' || credits >= UNLOCK_AT;
      var i = 0;

      // Structurally available (not coin-gated, or already unlocked). Distinct
      // from "can afford" — you still need PLAY_COST credits to launch.
      function isUnlocked(el) { return !el.hasAttribute('data-locked') || unlocked; }
      function render() { items.forEach(function (el, n) { el.classList.toggle('sel', n === i); }); }

      function move(d) {
        var n = i;
        do { n = (n + d + items.length) % items.length; } while (!isUnlocked(items[n]) && n !== i);
        i = n; render();
      }
      function start() {
        var el = items[i];
        if (!isUnlocked(el)) { flashCoin(); return; }   // coin-gated: bank 10 first
        if (credits < PLAY_COST) { flashCoin(); return; } // need a credit to play
        spend(PLAY_COST);
        var h = el.getAttribute('data-href');
        if (h) window.location.href = h;
      }
      function flashCoin() {
        coin.animate(
          [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' },
           { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
          { duration: 220, iterations: 2 });
      }
      function renderCredits() {
        coinLabel.textContent = credits > 0
          ? credits + (credits === 1 ? ' CREDIT' : ' CREDITS')
          : 'INSERT COIN';
        coin.classList.toggle('credited', credits > 0);  // green when positive
      }
      function applyUnlock() {
        if (!unlocked) return;
        items.forEach(function (el) {
          if (el.hasAttribute('data-locked')) { el.classList.remove('locked'); el.classList.add('unlocked'); }
        });
      }
      function persist() { localStorage.setItem(CREDITS_KEY, String(credits)); }
      function spend(n) { credits = Math.max(0, credits - n); persist(); renderCredits(); }
      function insertCoin() {
        credits += 1; persist();
        if (!unlocked && credits >= UNLOCK_AT) {
          unlocked = true; localStorage.setItem(UNLOCK_KEY, '1'); applyUnlock();
        }
        renderCredits();
      }

      coin.addEventListener('click', insertCoin);

      document.addEventListener('keydown', function (e) {
        switch (e.key) {
          case 'ArrowUp': case 'w': case 'W': move(-1); e.preventDefault(); break;
          case 'ArrowDown': case 's': case 'S': move(1); e.preventDefault(); break;
          case 'Enter': case ' ': start(); e.preventDefault(); break;
          case 'c': case 'C': insertCoin(); break;
        }
      });

      items.forEach(function (el, n) {
        el.addEventListener('mouseenter', function () { if (isUnlocked(el)) { i = n; render(); } });
        el.addEventListener('click', function () {
          if (!isUnlocked(el)) { flashCoin(); return; }
          i = n; render(); start();
        });
      });

      // Restore persisted state: show counter, reveal unlocked games.
      renderCredits();
      applyUnlock();
      render();
    })();
  </script>
</body>
</html>
